# Apache virtual host for Laravel + React SPA
# Place in docker/ directory and copy to /etc/apache2/sites-available/000-default.conf during Docker build

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -MultiViews +SymLinksIfOwnerMatch
        AllowOverride All
        Require all granted

        # Serve existing files directly
        RewriteEngine On

        # Don't rewrite API requests - let Laravel handle them
        RewriteCond %{REQUEST_URI} ^/api/ [NC]
        RewriteRule ^ - [L]

        # Don't rewrite existing files
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        # Everything else goes to index.php (Laravel SPA fallback)
        RewriteRule ^ index.php [L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/socialblog-error.log
    CustomLog ${APACHE_LOG_DIR}/socialblog-access.log combined
</VirtualHost>
